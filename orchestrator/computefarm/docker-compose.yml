version: "3.8"
services:
  flower:
    image: mher/flower:2.0
    container_name: computefarm-flower
    ports:
      - "5555:5555"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CELERY_BROKER_URL=redis://computefarm@host.docker.internal:6379/0
      - CELERY_RESULT_BACKEND=redis://computefarm@host.docker.internal:6379/1
      - FLOWER_PURGE_OFFLINE_WORKERS=60
      - FLOWER_UNAUTHENTICATED_API=true
    restart: always
